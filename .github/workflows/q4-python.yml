name: Python

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Check
        run: python -m py_compile src/main.py

      - name: Test
        run: pytest -v

  imagem:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build Docker image
        run: docker build -t api-python:latest .

      - name: Run Docker container
        run: docker run -d --name api-python -p 8080:8080 api-python:latest

      - name: Verify API
        run: |
          for i in $(seq 1 15); do
            curl -fs http://localhost:8080/healthy && exit 0
            sleep 2
          done
          exit 1

      - name: Test /hello
        run: curl -fs http://localhost:8080/hello

      - name: Container logs on failure
        if: failure()
        run: docker logs api-python

