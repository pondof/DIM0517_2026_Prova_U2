name: Python

on:
  pull_request:
    branches: 
      - 'develop/**'


jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Check
        run: python -m py_compile src/main.py

  testes:
    runs_on: ubuntu_latest
    timeout-minutes: 10 
    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -v
      - name: se falhar rodar unitarios
        if: failure()
        run: pytest -u
